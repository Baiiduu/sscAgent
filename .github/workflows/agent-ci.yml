name: Agent CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      repo_url:
        type: string
        required: false
        description: "Repository URL to analyze"
      execution_mode:
        type: choice
        required: true
        default: "reachability_analysis"
        description: "Security analysis stage"
        options:
          - upstream_analysis
          - reachability_analysis
          - remediation_reproduction
      debug_enabled:
        type: boolean
        default: false
        description: 'Enable debug mode for the workflow'

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

  analyze:
    name: Analyze repository
    runs-on: ubuntu-latest
    needs: typecheck
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repo_url != '' }}

    env:
      REPO_URL: ${{ inputs.repo_url }}
      ANALYSIS_EXECUTION_MODE: ${{ inputs.execution_mode }}
      SMOKE_PROVIDER: ${{ vars.SMOKE_PROVIDER || 'deepseek' }}
      SMOKE_MODEL: ${{ vars.SMOKE_MODEL || 'deepseek-v4-flash' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start findings server
        if: ${{ inputs.debug_enabled }}
        run: |
          mkdir -p .agent-data
          nohup bun run findings:server > .agent-data/findings-server.log 2>&1 &
          echo "Findings server started on http://127.0.0.1:8787"

      - name: Analyze repository
        run: bun run analyze "$REPO_URL"

      - name: Upload agent data
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-data
          path: ${{ github.workspace }}/.agent-data/**
          include-hidden-files: true
          if-no-files-found: warn

      - name: Setup tmate session
        if: ${{ always() && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
